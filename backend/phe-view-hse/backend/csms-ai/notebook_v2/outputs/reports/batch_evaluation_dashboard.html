        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

        .value.incorrect { color: #ef4444; }
        table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 12px; overflow: hidden; margin-bottom: 2rem; }

        th { background: #0f172a; font-weight: 600; color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(59, 130, 246, 0.05); }
        .badge { padding: 0.3rem 0.7rem; border-radius: 99px; font-size: 0.75rem; font-weight: 600; display: inline-block; }

        .badge.incorrect { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .progress-bar { background: #334155; border-radius: 6px; height: 20px; overflow: hidden; position: relative; }
        .progress-fill { height: 100%; transition: width 0.3s ease; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 600; color: white; }
        .progress-fill.correct { background: linear-gradient(90deg, #10b981, #059669); }
        .progress-fill.partial { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .progress-fill.incorrect { background: linear-gradient(90deg, #ef4444, #dc2626); }
        .comparison { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
        .comparison-item { background: #0f172a; padding: 0.5rem; border-radius: 6px; text-align: center; font-size: 0.8rem; }

function renderSummary() {
    const summary = DATA.summary;
    const total = DATA.total_categories;
    let html = '';
    
    if (summary.original) {
        html += `<div class="summary-card">
            <h3>Original Pipeline</h3>
            <div class="value">${summary.original.correct}/${total}</div>
            <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">${summary.original.accuracy.toFixed(1)}% accuracy</div>
        </div>`;
    }
    
    if (summary.enhanced_small) {
        html += `<div class="summary-card">
            <h3>Enhanced (Small)</h3>
            <div class="value">${summary.enhanced_small.correct}/${total}</div>
            <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">${summary.enhanced_small.accuracy.toFixed(1)}% accuracy</div>
        </div>`;
    }
    
    if (summary.enhanced_large) {
        html += `<div class="summary-card">
            <h3>Enhanced (Large)</h3>
            <div class="value">${summary.enhanced_large.correct}/${total}</div>
            <div style="color: #94a3b8; font-size: 0.9rem; margin-top: 0.5rem;">${summary.enhanced_large.accuracy.toFixed(1)}% accuracy</div>
        </div>`;
    }
    
    document.getElementById('summary-grid').innerHTML = html;
}

function renderResults() {
    const results = DATA.results;
    let html = '';
    
    results.forEach((r, idx) => {
        const expected = r.expected;
        
        let origScore = '-', origBadge = '';
        if (r.original) {
            origScore = r.original.predicted;
            origBadge = r.original_correct ? '<span class="badge correct">Correct</span>' : '<span class="badge incorrect">Wrong</span>';
        }
        
        let smallScore = '-', smallBadge = '';
        if (r.enhanced_small) {
            smallScore = r.enhanced_small.predicted;
            smallBadge = r.enhanced_small_correct ? '<span class="badge correct">Correct</span>' : '<span class="badge incorrect">Wrong</span>';
        }
        
        let largeScore = '-', largeBadge = '';
        if (r.enhanced_large) {
            largeScore = r.enhanced_large.predicted;
            largeBadge = r.enhanced_large_correct ? '<span class="badge correct">Correct</span>' : '<span class="badge incorrect">Wrong</span>';
        }
        
        let bestMatch = 'None';
        if (r.original_correct || r.enhanced_small_correct || r.enhanced_large_correct) {
            const matches = [];
            if (r.original_correct) matches.push('Orig');
            if (r.enhanced_small_correct) matches.push('Small');
            if (r.enhanced_large_correct) matches.push('Large');
            bestMatch = matches.join(', ');
        }
        
        html += `<tr>
            <td>${idx + 1}</td>
            <td><strong>${r.category_id}</strong></td>
            <td>${r.category_name.substring(0, 50)}${r.category_name.length > 50 ? '...' : ''}</td>
            <td><strong>${expected}</strong></td>
            <td>
                <div style="font-size: 1.2rem; font-weight: 700;">${origScore}</div>
                ${origBadge}
            </td>
            <td>
                <div style="font-size: 1.2rem; font-weight: 700;">${smallScore}</div>
                ${smallBadge}
            </td>
            <td>
                <div style="font-size: 1.2rem; font-weight: 700;">${largeScore}</div>
                ${largeBadge}
            </td>
            <td>${bestMatch}</td>
        </tr>`;
    });
    
    document.getElementById('results-tbody').innerHTML = html;
}

renderSummary();
renderResults();
