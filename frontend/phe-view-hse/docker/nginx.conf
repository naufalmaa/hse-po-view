# nginx untuk SPA + reverse proxy ke backend (nama service "backend" di docker-compose).
# Untuk server tanpa Docker, contoh yang sama ada di docs/handover/04-DEPLOY-SERVER.md.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1024m;   # unggah lampiran CSMS (ZIP/RAR) bisa besar

  location /api/ {
    proxy_pass http://backend:5142;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;       # WebSocket notifikasi
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600s;
  }

  location /uploads/ {
    proxy_pass http://backend:5142;
    proxy_set_header Host $host;
  }

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
